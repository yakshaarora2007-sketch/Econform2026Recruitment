<svg viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <!-- USER ICON -->
  <g transform="translate(10, 10)">
    <circle cx="20" cy="12" r="8" fill="#CC0000" stroke="#CC0000" stroke-width="1"/>
    <path d="M 10 30 Q 10 22 20 22 Q 30 22 30 30 L 30 38 Q 30 40 28 40 L 12 40 Q 10 40 10 38 Z" fill="#CC0000" stroke="#CC0000" stroke-width="1"/>
  </g>
  
  <!-- PHONE ICON -->
  <g transform="translate(60, 10)">
    <rect x="10" y="5" width="20" height="35" rx="2" fill="none" stroke="#CC0000" stroke-width="2"/>
    <line x1="12" y1="8" x2="28" y2="8" stroke="#CC0000" stroke-width="1"/>
    <line x1="12" y1="37" x2="28" y2="37" stroke="#CC0000" stroke-width="1"/>
    <circle cx="20" cy="30" r="1" fill="#CC0000"/>
  </g>
  
  <!-- ID CARD ICON -->
  <g transform="translate(110, 10)">
    <rect x="8" y="8" width="24" height="32" rx="1" fill="none" stroke="#F2C623" stroke-width="1.5"/>
    <circle cx="15" cy="16" r="4" fill="#F2C623"/>
    <path d="M 8 25 L 32 25" stroke="#F2C623" stroke-width="0.5"/>
    <line x1="15" y1="28" x2="28" y2="28" stroke="#F2C623" stroke-width="0.5"/>
    <line x1="15" y1="32" x2="28" y2="32" stroke="#F2C623" stroke-width="0.5"/>
  </g>
  
  <!-- MAIL ICON -->
  <g transform="translate(160, 10)">
    <rect x="8" y="10" width="24" height="18" rx="1" fill="none" stroke="#F2C623" stroke-width="1.5"/>
    <line x1="8" y1="10" x2="20" y2="19" stroke="#F2C623" stroke-width="1"/>
    <line x1="32" y1="10" x2="20" y2="19" stroke="#F2C623" stroke-width="1"/>
  </g>
  
  <!-- CHART ICON -->
  <g transform="translate(210, 10)">
    <rect x="10" y="28" width="4" height="12" fill="#00A651" stroke="#00A651" stroke-width="0.5"/>
    <rect x="16" y="20" width="4" height="20" fill="#00A651" stroke="#00A651" stroke-width="0.5"/>
    <rect x="22" y="12" width="4" height="28" fill="#00A651" stroke="#00A651" stroke-width="0.5"/>
    <line x1="10" y1="40" x2="26" y2="40" stroke="#00A651" stroke-width="1"/>
  </g>
  
  <!-- GLOBE ICON -->
  <g transform="translate(260, 10)">
    <circle cx="20" cy="20" r="10" fill="none" stroke="#00A651" stroke-width="1.5"/>
    <path d="M 15 15 Q 20 18 25 15" fill="none" stroke="#00A651" stroke-width="0.5"/>
    <path d="M 15 25 Q 20 22 25 25" fill="none" stroke="#00A651" stroke-width="0.5"/>
    <line x1="20" y1="10" x2="20" y2="30" stroke="#00A651" stroke-width="0.5"/>
  </g>
  
  <!-- HANDSHAKE ICON -->
  <g transform="translate(310, 10)">
    <path d="M 10 18 Q 10 14 14 14 Q 18 14 20 18" fill="none" stroke="#0052CC" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 30 18 Q 30 14 26 14 Q 22 14 20 18" fill="none" stroke="#0052CC" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="10" y1="18" x2="8" y2="28" stroke="#0052CC" stroke-width="1" stroke-linecap="round"/>
    <line x1="30" y1="18" x2="32" y2="28" stroke="#0052CC" stroke-width="1" stroke-linecap="round"/>
    <path d="M 14 19 L 18 22 L 22 19" fill="none" stroke="#0052CC" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>