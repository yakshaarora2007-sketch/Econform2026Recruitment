<svg viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <!-- FREE PARKING -->
  <g transform="translate(10, 10)">
    <rect width="80" height="80" fill="#F5E6D3" stroke="#333" stroke-width="1"/>
    <circle cx="40" cy="20" r="12" fill="#DD0000"/>
    <circle cx="40" cy="20" r="8" fill="none" stroke="#FFF" stroke-width="1"/>
    <text x="40" y="55" font-size="10" font-weight="bold" text-anchor="middle" fill="#000">PARKING</text>
  </g>
  
  <!-- CHANCE -->
  <g transform="translate(105, 10)">
    <rect width="80" height="80" fill="#FFF" stroke="#333" stroke-width="1"/>
    <text x="40" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="#CC0000">?</text>
    <text x="40" y="55" font-size="10" font-weight="bold" text-anchor="middle" fill="#000">CHANCE</text>
  </g>
  
  <!-- COMMUNITY CHEST -->
  <g transform="translate(200, 10)">
    <rect width="80" height="80" fill="#4169E1" stroke="#333" stroke-width="1"/>
    <rect x="15" y="15" width="50" height="30" fill="#8B7355" stroke="#333" stroke-width="0.5"/>
    <text x="40" y="40" font-size="8" font-weight="bold" text-anchor="middle" fill="#FFD700">CC</text>
    <text x="40" y="60" font-size="7" font-weight="bold" text-anchor="middle" fill="#000">COMMUNITY</text>
    <text x="40" y="70" font-size="7" font-weight="bold" text-anchor="middle" fill="#000">CHEST</text>
  </g>
  
  <!-- GO TO JAIL -->
  <g transform="translate(295, 10)">
    <rect width="80" height="80" fill="#F5E6D3" stroke="#333" stroke-width="1"/>
    <circle cx="40" cy="18" r="8" fill="#003366" stroke="#333" stroke-width="0.5"/>
    <text x="40" y="22" font-size="6" fill="#FFF" text-anchor="middle" font-weight="bold">JAIL</text>
    <text x="40" y="55" font-size="9" font-weight="bold" text-anchor="middle" fill="#000">GO TO</text>
    <text x="40" y="67" font-size="9" font-weight="bold" text-anchor="middle" fill="#000">JAIL</text>
  </g>
</svg>