<svg viewBox="0 0 240 120" xmlns="http://www.w3.org/2000/svg">
  <!-- First Dice -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="60" height="60" fill="#F5E6D3" stroke="#333" stroke-width="2" rx="3"/>
    <!-- Dots for 5 -->
    <circle cx="15" cy="15" r="4" fill="#000"/>
    <circle cx="45" cy="15" r="4" fill="#000"/>
    <circle cx="30" cy="30" r="4" fill="#000"/>
    <circle cx="15" cy="45" r="4" fill="#000"/>
    <circle cx="45" cy="45" r="4" fill="#000"/>
  </g>
  
  <!-- Second Dice -->
  <g transform="translate(130, 30)">
    <rect x="0" y="0" width="60" height="60" fill="#F5E6D3" stroke="#333" stroke-width="2" rx="3"/>
    <!-- Dots for 4 -->
    <circle cx="15" cy="15" r="4" fill="#000"/>
    <circle cx="45" cy="15" r="4" fill="#000"/>
    <circle cx="15" cy="45" r="4" fill="#000"/>
    <circle cx="45" cy="45" r="4" fill="#000"/>
  </g>
</svg>